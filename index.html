<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reduction of Camphor — Stereochemistry of NaBH4 Reduction</title>
  <meta name="description" content="An interactive, fact-checked walkthrough of the sodium borohydride reduction of camphor to isoborneol and borneol: real 3D structures, the mechanism (steric approach control), the lab procedure, and a live yield calculator." />
  <link rel="icon" href="https://orgolabs.github.io/shared/brand/orgolabs-icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="stylesheet" href="https://orgolabs.github.io/shared/styles.css" />
</head>
<body>
  <noscript><p style="padding:24px">This interactive lab needs JavaScript. Source: <a href="https://github.com/orgolabs/camphor-reduction">github.com/orgolabs/camphor-reduction</a></p></noscript>

  <script>
    window.LAB = {
      repo: "camphor-reduction",
      labName: "Camphor Reduction",
      eyebrow: "Interactive organic chemistry · diastereoselective reduction",
      title: "The Reduction of Camphor",
      lede: "Sodium borohydride turns the rigid bicyclic ketone <strong>camphor</strong> into a pair of diastereomeric alcohols — <strong>isoborneol</strong> (major) and <strong>borneol</strong> (minor). Which one wins, and <em>why</em>, is a classic lesson in <strong>steric approach control</strong>. Rotate the real 3D molecules, follow the mechanism, and scale the experiment below.",
      reaction: "\\ce{C10H16O ->[\\text{NaBH4}][\\text{MeOH}] C10H18O}",
      content: "content.md",
      viewers: [
        { id: "view-camphor", key: "camphor", kind: "start", role: "Starting material", name: "Camphor",
          iupac: "(1R,4R)-1,7,7-trimethylbicyclo[2.2.1]heptan-2-one", note: "C=O at C2. The exo face (top) is roofed by the gem-dimethyl bridge." },
        { id: "view-isoborneol", key: "isoborneol", kind: "major", role: "Major ~90%", name: "Isoborneol",
          iupac: "(1R,2R,4R)-1,7,7-trimethylbicyclo[2.2.1]heptan-2-ol", note: "<b>exo-OH.</b> Hydride added to the open endo face, so –OH points exo." },
        { id: "view-borneol", key: "borneol", kind: "minor", role: "Minor ~10%", name: "Borneol",
          iupac: "(1R,2S,4R)-1,7,7-trimethylbicyclo[2.2.1]heptan-2-ol", note: "<b>endo-OH.</b> Hydride forced past the bridge (exo), so –OH points endo." }
      ],
      pathway: [
        { node: { img: "camphor.png", name: "Camphor", sub: "$\\ce{C10H16O}$ · ketone" } },
        { op: { cond: "\\ce{NaBH4}", sub: "MeOH · endo H⁻" } },
        { node: { img: "isoborneol.png", name: "Isoborneol", sub: "exo-OH · major ~90%", kind: "major" } },
        { plus: true },
        { node: { img: "borneol.png", name: "Borneol", sub: "endo-OH · minor ~10%", kind: "minor" } }
      ],
      pathwayCaption: "Hydride adds irreversibly to the open <em>endo</em> face, placing –OH <em>exo</em> (isoborneol, major). The borate ester is hydrolyzed in the aqueous work-up.",
      calculator: {
        intro: "Pre-filled with the lab manual's micro-scale amounts — change any input and everything updates. Molar masses: camphor 152.23, product 154.25, $\\ce{NaBH4}$ 37.83 g/mol; methanol at 5 mL/g.",
        inputs: [
          { id: "in-camphor", label: "Camphor starting mass (g)", value: "0.100", step: "0.01" },
          { id: "in-equiv", label: "NaBH₄ (molar equivalents)", value: "4.0", step: "0.1", note: "1 equiv delivers 4 hydrides; manual ≈ 4 equiv" },
          { id: "in-isolated", label: "Isolated product mass (g)", value: "0.080", step: "0.01", optional: true }
        ],
        outputs: [
          { id: "o-mmol", label: "Camphor", unit: "mmol" },
          { id: "o-nabh4", label: "NaBH₄ needed", unit: "g" },
          { id: "o-meoh", label: "Methanol", unit: "mL" },
          { id: "o-theory", label: "Theoretical product", unit: "g" },
          { id: "o-iso", label: "Expected isoborneol (~90%)", unit: "g", kind: "major" },
          { id: "o-bor", label: "Expected borneol (~10%)", unit: "g", kind: "minor" },
          { id: "o-yield", label: "Percent yield", unit: "%", kind: "yield" }
        ],
        compute: function (v) {
          var MWc = 152.23, MWp = 154.25, MWn = 37.83;
          if (!(v["in-camphor"] > 0)) return {};
          var c = v["in-camphor"], theory = c / MWc * MWp;
          var o = {
            "o-mmol": (c / MWc * 1000).toFixed(2),
            "o-nabh4": (c / MWc * v["in-equiv"] * MWn).toFixed(3),
            "o-meoh": (c * 5).toFixed(2),
            "o-theory": theory.toFixed(3),
            "o-iso": (theory * 0.90).toFixed(3),
            "o-bor": (theory * 0.10).toFixed(3)
          };
          o["o-yield"] = v["in-isolated"] > 0 ? (v["in-isolated"] / theory * 100).toFixed(1) : "";
          return o;
        }
      },
      references: [
        { authors: "Brown, H. C.; Muzzio, J.", title: "Rates of Reaction of Sodium Borohydride with Bicyclic Ketones. Steric Approach Control and Steric Departure Control in the Reactions of Rigid Bicyclic Systems", meta: "J. Am. Chem. Soc. 1966, 88 (12), 2811–2822.", note: "The primary source: introduces “steric approach control” using camphor; the origin of the isoborneol-major result.", url: "https://doi.org/10.1021/ja00964a034", linkText: "doi.org/10.1021/ja00964a034", access: "paywall" },
        { authors: "Wigfield, D. C.", title: "Stereochemistry and mechanism of ketone reductions by hydride reagents", meta: "Tetrahedron 1979, 35 (4), 449–462.", note: "Classic review weighing steric approach, torsional strain and electronic effects.", url: "https://doi.org/10.1016/0040-4020(79)80140-4", linkText: "doi.org/10.1016/0040-4020(79)80140-4", access: "paywall" },
        { authors: "Markgraf, J. H.", title: "Stereochemical correlations in the camphor series", meta: "J. Chem. Educ. 1967, 44 (1), 36.", note: "Education-oriented treatment of exo/endo relationships in the bornane/camphor system.", url: "https://doi.org/10.1021/ed044p36", linkText: "doi.org/10.1021/ed044p36", access: "paywall" },
        { authors: "PubChem, U.S. National Library of Medicine.", title: "Camphor (CID 159055), Isoborneol (CID 6321405), Borneol (CID 6552009)", meta: "Public-domain compound records in the natural (1R,4R) series.", note: "Free and public. The 3D coordinates come directly from these defined-stereochemistry records.", url: "https://pubchem.ncbi.nlm.nih.gov/compound/159055", linkText: "pubchem.ncbi.nlm.nih.gov/compound/159055", access: "open" },
        { authors: "Wikipedia contributors.", title: "Borneol / Isoborneol — diastereomer definitions and reduction methods", meta: "Open reference corroborating the exo/endo assignment.", note: "Free and public; a convenient entry point with onward citations.", url: "https://en.wikipedia.org/wiki/Borneol", linkText: "en.wikipedia.org/wiki/Borneol", access: "open" },
        { authors: "Rego, N.; Koes, D.", title: "3Dmol.js: molecular visualization with WebGL", meta: "Bioinformatics 2015, 31 (8), 1322–1324.", note: "The open-source (BSD-3) library rendering the interactive structures.", url: "https://doi.org/10.1093/bioinformatics/btu829", linkText: "doi.org/10.1093/bioinformatics/btu829", access: "open" }
      ]
    };
  </script>
  <script src="js/structures.js"></script>
  <script src="https://orgolabs.github.io/shared/lab.js"></script>
</body>
</html>
